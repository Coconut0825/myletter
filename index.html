<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link rel="stylesheet" href="style.css" />

    <title>Sorry na po babyy ko ❤️</title>

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Aldrich&family=Pixelify+Sans:wght@400..700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>

    <!-- ========================= -->
    <!-- Envelope Screen -->
    <!-- ========================= -->

    <div id="envelope-container">

      <img
        src="envelope.png"
        alt="Envelope"
        id="envelope"
      />

      <p>♡ Letter for You ♡</p>

    </div>


    <!-- ========================= -->
    <!-- Letter Screen -->
    <!-- ========================= -->

    <div id="letter-container">

      <div class="letter-window">

        <!-- Title -->
        <h1 id="letter-title">
          Bati Na Po Ba Tayo? 🥺❤️
        </h1>


        <!-- Cat -->
        <img
          src="cat_heart.gif"
          class="cat"
          id="letter-cat"
          alt="Cute cat with heart"
        />


        <!-- Yes / No Buttons -->
        <div
          class="buttons"
          id="letter-buttons"
        >

          <img
            src="yes.png"
            class="btn yes-btn"
            alt="Yes"
          />


          <div class="no-wrapper">

            <img
              src="no.png"
              class="btn no-btn"
              alt="No"
            />

          </div>

        </div>


        <!-- Final Message -->
        <p
          id="final-text"
          class="final-text"
          style="display: none;"
        >
          <strong>Yayyyyyyyyyy! ❤️</strong>
          <br><br>

          Sorry na po babyy ko. 🥺❤️
          I love you so much and I will never do it again.
          Please forgive me.

          <br><br>

          I promise to be a better person for you,
          to learn from my mistakes, and to take better
          care of your heart.

          <br><br>

          I love you so much, babyy ko. ❤️
        </p>


        <!-- Next Button -->
        <button
          id="next-btn"
          style="display: none;"
        >
          Next 💌
        </button>

      </div>

    </div>


    <!-- JavaScript -->
    <script src="script.js"></script>

  </body>
</html>
